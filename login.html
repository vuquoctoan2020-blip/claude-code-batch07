<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập</title>

  <!-- Fonts: Be Vietnam Pro (headings, full Vietnamese support) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Be+Vietnam+Pro:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            base: '#090A14',
            surface: '#11131F',
            elevated: '#181B2A',
            line: '#262A3D',
            primary: {
              DEFAULT: '#DF6B33',
              hover: '#E87D49',
              active: '#C85A26',
            },
          },
          fontFamily: {
            heading: ['Be Vietnam Pro', 'Poppins', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <style>
    body { background-color: #090A14; }
    /* Keep autofilled inputs dark */
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #F1F2F6;
      -webkit-box-shadow: 0 0 0 1000px #181B2A inset;
      caret-color: #F1F2F6;
      transition: background-color 9999s ease-in-out 0s;
    }
  </style>
</head>

<body class="min-h-screen bg-base font-sans text-slate-200 antialiased">
  <!-- Background glow -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-40 -left-40 h-[28rem] w-[28rem] rounded-full bg-primary/20 blur-[120px]"></div>
    <div class="absolute -bottom-48 -right-32 h-[30rem] w-[30rem] rounded-full bg-primary/10 blur-[140px]"></div>
  </div>

  <main class="relative flex min-h-screen items-center justify-center px-4 py-10 sm:px-6 lg:px-8">
    <div class="w-full max-w-md overflow-hidden rounded-2xl border border-line bg-surface/80 shadow-2xl shadow-black/40 backdrop-blur">

      <!-- Form -->
      <section class="p-6 sm:p-10">
        <!-- Logo -->
        <div class="mb-8 flex items-center gap-2">
          <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-primary text-white">
            <i data-lucide="zap" class="h-5 w-5"></i>
          </span>
          <span class="font-heading text-lg font-bold tracking-tight text-white">Nebula</span>
        </div>

        <header>
          <h1 class="font-heading text-2xl font-bold text-white sm:text-3xl">Chào mừng trở lại</h1>
          <p class="mt-2 text-sm text-slate-400">Đăng nhập vào tài khoản của bạn để tiếp tục.</p>
        </header>

        <form id="loginForm" class="mt-8 space-y-5" novalidate>
          <!-- Email -->
          <div>
            <label for="email" class="mb-1.5 block text-sm font-medium text-slate-300">Email</label>
            <div class="relative">
              <i data-lucide="mail" class="pointer-events-none absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-500"></i>
              <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="emailError"
                placeholder="ban@vidu.com"
                class="w-full rounded-xl border border-line bg-elevated py-3 pl-11 pr-4 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/30" />
            </div>
            <p id="emailError" class="mt-1.5 hidden items-center gap-1 text-xs text-red-400">
              <i data-lucide="alert-circle" class="h-3.5 w-3.5"></i><span data-msg></span>
            </p>
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="mb-1.5 block text-sm font-medium text-slate-300">Mật khẩu</label>
            <div class="relative">
              <i data-lucide="lock" class="pointer-events-none absolute left-3.5 top-1/2 h-5 w-5 -translate-y-1/2 text-slate-500"></i>
              <input id="password" name="password" type="password" autocomplete="current-password" required aria-describedby="passwordError"
                placeholder="Nhập mật khẩu"
                class="w-full rounded-xl border border-line bg-elevated py-3 pl-11 pr-12 text-sm text-slate-100 placeholder-slate-500 outline-none transition focus:border-primary focus:ring-2 focus:ring-primary/30" />
              <button type="button" id="togglePassword" aria-label="Hiện mật khẩu"
                class="absolute right-2 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-lg text-slate-500 transition hover:bg-white/5 hover:text-slate-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
                <span data-icon="show"><i data-lucide="eye" class="h-5 w-5"></i></span>
                <span data-icon="hide" class="hidden"><i data-lucide="eye-off" class="h-5 w-5"></i></span>
              </button>
            </div>
            <p id="passwordError" class="mt-1.5 hidden items-center gap-1 text-xs text-red-400">
              <i data-lucide="alert-circle" class="h-3.5 w-3.5"></i><span data-msg></span>
            </p>
          </div>

          <!-- Remember me + Forgot password -->
          <div class="flex flex-wrap items-center justify-between gap-3">
            <label for="remember" class="flex cursor-pointer select-none items-center gap-2 text-sm text-slate-300">
              <input id="remember" name="remember" type="checkbox"
                class="h-4 w-4 cursor-pointer rounded border-line bg-elevated accent-[#DF6B33] focus:ring-2 focus:ring-primary/40" />
              Ghi nhớ đăng nhập
            </label>
            <a href="#" class="text-sm font-medium text-primary transition hover:text-primary-hover hover:underline">
              Quên mật khẩu?
            </a>
          </div>

          <!-- Submit -->
          <button type="submit" id="submitBtn"
            class="group flex w-full items-center justify-center gap-2 rounded-xl bg-primary px-4 py-3 font-heading text-sm font-semibold text-white shadow-lg shadow-primary/25 transition hover:bg-primary-hover active:bg-primary-active focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50 focus-visible:ring-offset-2 focus-visible:ring-offset-surface disabled:cursor-not-allowed disabled:opacity-70">
            <span id="submitText">Đăng nhập</span>
            <span id="submitArrow"><i data-lucide="arrow-right" class="h-4 w-4 transition group-hover:translate-x-0.5"></i></span>
            <span id="submitSpinner" class="hidden"><i data-lucide="loader-2" class="h-4 w-4 animate-spin"></i></span>
          </button>
        </form>

        <!-- Divider -->
        <div class="my-7 flex items-center gap-4">
          <span class="h-px flex-1 bg-line"></span>
          <span class="text-xs uppercase tracking-wider text-slate-500">Hoặc đăng nhập bằng</span>
          <span class="h-px flex-1 bg-line"></span>
        </div>

        <!-- Social sign-in -->
        <div id="socialButtons" class="grid grid-cols-1 gap-2.5 sm:grid-cols-3">
          <button type="button" class="flex items-center justify-center gap-2 rounded-xl border border-line bg-elevated px-3 py-2.5 text-sm font-medium text-slate-200 transition hover:border-slate-600 hover:bg-white/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
            <!-- Google mark (Lucide has no brand icon for Google) -->
            <svg class="h-5 w-5" viewBox="0 0 24 24" aria-hidden="true">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span>Google</span>
          </button>
          <button type="button" class="flex items-center justify-center gap-2 rounded-xl border border-line bg-elevated px-3 py-2.5 text-sm font-medium text-slate-200 transition hover:border-slate-600 hover:bg-white/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
            <i data-lucide="github" class="h-5 w-5"></i>
            <span>GitHub</span>
          </button>
          <button type="button" class="flex items-center justify-center gap-2 rounded-xl border border-line bg-elevated px-3 py-2.5 text-sm font-medium text-slate-200 transition hover:border-slate-600 hover:bg-white/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/40">
            <i data-lucide="facebook" class="h-5 w-5 text-[#1877F2]"></i>
            <span>Facebook</span>
          </button>
        </div>

        <p class="mt-8 text-center text-sm text-slate-400">
          Chưa có tài khoản?
          <a href="register.html" class="font-medium text-primary transition hover:text-primary-hover hover:underline">Vui lòng đăng ký</a>
        </p>
      </section>
    </div>
  </main>

  <!-- Toast -->
  <div id="toast" role="status" aria-live="polite"
    class="pointer-events-none fixed bottom-6 left-1/2 z-50 flex -translate-x-1/2 translate-y-4 items-center gap-2 rounded-xl border border-line bg-elevated px-4 py-3 text-sm text-slate-100 opacity-0 shadow-xl transition duration-300">
    <i data-lucide="check-circle-2" class="h-5 w-5 text-emerald-400"></i>
    <span id="toastText">Đăng nhập thành công!</span>
  </div>

  <script>
    lucide.createIcons();

    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const emailError = document.getElementById('emailError');
    const passwordError = document.getElementById('passwordError');
    const toggleBtn = document.getElementById('togglePassword');
    const submitBtn = document.getElementById('submitBtn');
    const toast = document.getElementById('toast');
    const toastText = document.getElementById('toastText');

    // Show / hide password
    toggleBtn.addEventListener('click', () => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      toggleBtn.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
      toggleBtn.querySelector('[data-icon="show"]').classList.toggle('hidden', show);
      toggleBtn.querySelector('[data-icon="hide"]').classList.toggle('hidden', !show);
    });

    // Show an error message under a field, or clear it when message is empty
    function setError(input, errorEl, message) {
      const hasError = Boolean(message);
      errorEl.querySelector('[data-msg]').textContent = message || '';
      errorEl.classList.toggle('hidden', !hasError);
      errorEl.classList.toggle('flex', hasError);
      input.classList.toggle('border-red-500', hasError);
      input.classList.toggle('focus:border-red-500', hasError);
      input.setAttribute('aria-invalid', hasError);
    }

    const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // Returns an error message, or '' when valid
    function validateEmail() {
      const value = email.value.trim();
      if (!value) return 'Vui lòng nhập email.';
      if (!EMAIL_PATTERN.test(value)) return 'Email không hợp lệ.';
      return '';
    }

    function validatePassword() {
      if (!password.value) return 'Vui lòng nhập mật khẩu.';
      return '';
    }

    function showToast(message) {
      toastText.textContent = message;
      toast.classList.remove('opacity-0', 'translate-y-4');
      setTimeout(() => toast.classList.add('opacity-0', 'translate-y-4'), 2500);
    }

    // Restore remembered email
    try {
      const saved = localStorage.getItem('rememberedEmail');
      if (saved) {
        email.value = saved;
        document.getElementById('remember').checked = true;
      }
    } catch (_) {}

    // Validate when leaving a field; re-validate while typing once an error is shown
    email.addEventListener('blur', () => setError(email, emailError, validateEmail()));
    password.addEventListener('blur', (e) => {
      if (e.relatedTarget === toggleBtn) return; // clicking show/hide is not leaving the field
      setError(password, passwordError, validatePassword());
    });
    email.addEventListener('input', () => {
      if (email.getAttribute('aria-invalid') === 'true') setError(email, emailError, validateEmail());
    });
    password.addEventListener('input', () => {
      if (password.getAttribute('aria-invalid') === 'true') setError(password, passwordError, validatePassword());
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const emailMsg = validateEmail();
      const passMsg = validatePassword();
      setError(email, emailError, emailMsg);
      setError(password, passwordError, passMsg);
      if (emailMsg || passMsg) {
        (emailMsg ? email : password).focus();
        return;
      }

      try {
        if (document.getElementById('remember').checked) {
          localStorage.setItem('rememberedEmail', email.value.trim());
        } else {
          localStorage.removeItem('rememberedEmail');
        }
      } catch (_) {}

      // Simulated request
      submitBtn.disabled = true;
      document.getElementById('submitText').textContent = 'Đang đăng nhập...';
      document.getElementById('submitArrow').classList.add('hidden');
      document.getElementById('submitSpinner').classList.remove('hidden');

      setTimeout(() => {
        submitBtn.disabled = false;
        document.getElementById('submitText').textContent = 'Đăng nhập';
        document.getElementById('submitArrow').classList.remove('hidden');
        document.getElementById('submitSpinner').classList.add('hidden');
        showToast('Đăng nhập thành công!');
        setTimeout(() => { window.location.href = 'charts.html'; }, 1000);
      }, 1200);
    });

    // Social buttons (demo)
    document.querySelectorAll('#socialButtons button').forEach((btn) => {
      btn.addEventListener('click', () => showToast(`Đang chuyển đến ${btn.textContent.trim()}...`));
    });
  </script>
</body>
</html>
